:root {

===================================================== */

   PROGRAM
===================================================== */

.card {

  padding: 20px;

  gap: 20px;

  transition: .2s;

}


.card:hover {

  background: var(--hover);

  border-color: #5b5547;

}


/* =====================================================
   INFORMASI PROGRAM
===================================================== */

.info {

  flex: 1;

  min-width: 0;

}

  color: var(--paper);

  font-size: 1rem;

  font-weight: bold;

}


.label {

  color: var(--gold);

  font-size: .72rem;

  margin-top: 7px;

}


.desc {

  color: var(--muted);

  font-size: .8rem;

  margin-top: 4px;

  line-height: 1.5;

}


.category {

  display: inline-block;

  margin-top: 10px;

  padding: 4px 8px;

  border: 1px solid var(--line);

  color: var(--muted);

  font-size: .65rem;

}


/* =====================================================
   TOMBOL DOWNLOAD
===================================================== */

.download {

  display: inline-block;

  color: var(--gold);

  text-decoration: none;

  font-family: monospace;

  font-size: .75rem;

  white-space: nowrap;

  transition: .2s;

}


.download:hover {

  background: var(--gold);

  color: #1c1b19;

}


/* =====================================================

===================================================== */

.empty {

/* =====================================================
   FOOTER
===================================================== */

footer {

  color: var(--muted);

/* =====================================================

===================================================== */

@media (max-width: 600px) {

  }


  .card {

    gap: 14px;

  }

  }

}

/* =====================================================
   MENAMPILKAN PROGRAM
===================================================== */

function tampilkanProgram() {


  const list = document.getElementById("programList");


  const search = document

    .getElementById("search")

    .value

    .toLowerCase();


  const category = document

    .getElementById("category")

    .value;



  /* FILTER PROGRAM */

  const hasil = programs.filter(program => {


    const cocokSearch =

      program.name.toLowerCase().includes(search) ||

      program.desc.toLowerCase().includes(search) ||

      program.category.toLowerCase().includes(search);


    const cocokKategori =

      category === "semua" ||

      program.category === category;


    return cocokSearch && cocokKategori;


  });



  /* TIDAK ADA HASIL */

  if (hasil.length === 0) {


    list.innerHTML = `

      <div class="empty">

        Program tidak ditemukan.

      </div>

    `;


    return;

  }



  /* TAMPILKAN PROGRAM */

  list.innerHTML = hasil.map(program => {


    /*
      Tombol DOWNLOAD hanya muncul
      jika link Google Drive sudah diisi.
    */

    const tombolDownload =

      program.drive &&

      program.drive !== "PASTE LINK GOOGLE DRIVE DI SINI"

      ? `

        <a

          class="download"

          href="${program.drive}"

          target="_blank"

          rel="noopener noreferrer"

        >

          DOWNLOAD

        </a>

      `

      : "";



    return `

      <div class="card">


        <div class="info">


          <div class="label">

            Program

          </div>


          <div class="title">

            ${program.name}

          </div>



          <div class="label">

            Kategori

          </div>


          <div class="category">

            ${program.category}

          </div>



          <div class="label">

            Deskripsi

          </div>


          <div class="desc">

            ${program.desc}

          </div>


        </div>



        ${tombolDownload}


      </div>

    `;


  }).join("");


}



/* =====================================================

===================================================== */

tampilkanProgram();
