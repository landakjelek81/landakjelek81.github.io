<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>Games - Dunia Landak</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: #f5eadc;

      background:
        linear-gradient(
          rgba(35, 20, 12, 0.88),
          rgba(35, 20, 12, 0.94)
        ),
        url("gambar.jfif");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;

      font-family: "IBM Plex Mono", monospace;
    }

    header {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px 25px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;

      color: #d8b08a;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: #fff;
    }

    h1 {
      margin: 0;

      font-family: "Fraunces", serif;
      font-size: 46px;
      line-height: 1.1;

      color: #fff4e8;
    }

    .subtitle {
      margin-top: 10px;

      color: #cbb8a5;
      font-size: 14px;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 10px 20px 40px;
    }

    .list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;

      padding: 22px;

      background: rgba(58, 35, 22, 0.86);
      border: 1px solid rgba(214, 174, 133, 0.18);
      border-radius: 16px;

      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.25);

      transition:
        transform 0.2s ease,
        border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(214, 174, 133, 0.4);
    }

    .title {
      display: inline-block;

      color: #fff4e8;

      font-family: "Fraunces", serif;
      font-size: 24px;
      font-weight: 700;

      text-decoration: none;
      margin-bottom: 8px;
    }

    .title:hover {
      color: #e6c39d;
    }

    .desc {
      margin: 0 0 10px;

      color: #d7c5b4;
      font-size: 13px;
      line-height: 1.6;

      overflow-wrap: anywhere;
    }

    .meta {
      margin: 0;

      color: #a99481;
      font-size: 12px;
      line-height: 1.5;
    }

    .button {
      display: inline-block;

      padding: 11px 15px;

      color: #2c1a10;
      background: #e1bd94;

      border-radius: 10px;

      text-decoration: none;
      font-size: 12px;
      font-weight: 600;

      white-space: nowrap;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .button:hover {
      background: #f0d1ad;
      transform: translateY(-1px);
    }

    footer {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px 35px;

      color: #806d5b;
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 760px) {
      .list {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 38px;
      }
    }

    @media (max-width: 480px) {
      header {
        padding-top: 30px;
      }

      h1 {
        font-size: 34px;
      }

      .card {
        grid-template-columns: 1fr;
      }

      .button {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <header>
    <a class="back" href="index.html">
      ← Kembali
    </a>

    <h1>Games</h1>

    <p class="subtitle">
      Kumpulan games dan permainan.
    </p>
  </header>


  <main>
    <div class="list" id="gameList"></div>
  </main>


  <footer>
    Dunia Landak · Games
  </footer>


  <script>
    "use strict";


    /*
     * DATA GAMES
     * Data bersifat statis dan tidak berasal dari input pengunjung.
     */

    const games = [
      {
        name: "Zombie Shooter",
        desc: "Games Menembak Zombie",
        meta: "All Windows · v3.9 · 45.5 MB",
        drive: "https://drive.google.com/file/d/1p94neGHys94dGhZpmup5fcMlNe2SNt4U/view?usp=sharing"
      },

      {
        name: "Zombie Apocalypse",
        desc: "Games Menembak kumpulan Zombie",
        meta: "All Windows · 72.5 MB",
        drive: "https://drive.google.com/file/d/1UCzaBa4oUwck1aYKIi_B3aRGwlgwRiX6/view?usp=sharing"
      },

      {
        name: "Samurai Vengeance II",
        desc: "Games Seru dari seorang Samurai",
        meta: "All Windows · 72.2 MB",
        drive: "https://drive.google.com/file/d/1J8jdrpR84j8WLzYoTg7ASPeY8Tml9VPs/view?usp=sharing"
      },

      {
        name: "Kumpulan Games Mini Class",
        desc: "Mini Games Untuk All Windows",
        meta: "All Windows · 93.5 MB",
        drive: "https://drive.google.com/file/d/1QiUcWJNZLBA-yKDf7XF1NTGRBFu-5EQE/view?usp=drive_link"
      },

      {
        name: "Grand Prix F1",
        desc: "Game Balapan F1",
        meta: "All Windows · 140.3 MB",
        drive: "https://drive.google.com/file/d/1ViBm5srBSutlPFGe9yyt-DKS-m2MLiQl/view?usp=sharing"
      },

      {
        name: "Great DaVinci Code",
        desc: "Games Teka teki Gambar",
        meta: "All Windows · 11.7 MB",
        drive: "https://drive.google.com/file/d/1-QnFmTgPzKZzpy_UK8Op9WVpDR7SZ2Ej/view?usp=sharing"
      }
    ];


    const gameList = document.getElementById("gameList");


    /*
     * VALIDASI LINK
     *
     * Hanya izinkan:
     * - HTTPS
     * - Google Drive
     */

    function linkGoogleDriveValid(urlString) {
      try {
        const url = new URL(urlString);

        return (
          url.protocol === "https:" &&
          (
            url.hostname === "drive.google.com" ||
            url.hostname === "www.drive.google.com"
          )
        );
      } catch {
        return false;
      }
    }


    /*
     * MEMBUAT ELEMEN TEKS
     *
     * textContent digunakan agar teks tidak
     * diproses sebagai HTML.
     */

    function buatTeks(tag, className, text) {
      const element = document.createElement(tag);

      element.className = className;
      element.textContent = text;

      return element;
    }


    /*
     * RENDER GAME
     */

    function tampilkanGames() {

      gameList.replaceChildren();


      const fragment = document.createDocumentFragment();


      games.forEach(game => {

        const card = document.createElement("article");
        card.className = "card";


        const content = document.createElement("div");


        const title = document.createElement("a");

        title.className = "title";
        title.textContent = String(game.name || "");


        /*
         * Validasi URL sebelum dimasukkan
         * sebagai href.
         */

        if (linkGoogleDriveValid(game.drive)) {

          title.href = game.drive;
          title.target = "_blank";
          title.rel = "noopener noreferrer";

        }


        const desc = buatTeks(
          "p",
          "desc",
          String(game.desc || "")
        );


        const meta = buatTeks(
          "p",
          "meta",
          String(game.meta || "")
        );


        content.appendChild(title);
        content.appendChild(desc);
        content.appendChild(meta);


        card.appendChild(content);


        /*
         * Tombol Buka hanya dibuat jika
         * link lolos validasi.
         */

        if (linkGoogleDriveValid(game.drive)) {

          const button = document.createElement("a");

          button.className = "button";
          button.href = game.drive;
          button.target = "_blank";
          button.rel = "noopener noreferrer";
          button.textContent = "Buka";

          card.appendChild(button);
        }


        fragment.appendChild(card);

      });


      gameList.appendChild(fragment);
    }


    /*
     * TAMPILKAN SEMUA GAME
     */

    tampilkanGames();

  </script>

</body>
</html>
