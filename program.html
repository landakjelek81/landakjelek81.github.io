<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Program - Landak Jelek</title>

<style>
:root{
  --bg:url("gambar.jfif") center/cover fixed;
  --card:rgba(0,0,0,.72);
  --text:#fff;
  --accent:#00ff88;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

header{
  background:rgba(0,0,0,.85);
  padding:20px;
  text-align:center;
  border-bottom:2px solid var(--accent);
}

header h1{
  margin:0 0 10px;
  color:var(--accent);
}

header a{
  color:white;
  text-decoration:none;
}

.container{
  max-width:1000px;
  margin:30px auto;
  padding:20px;
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

input,select{
  padding:12px;
  border-radius:8px;
  border:none;
  font-size:16px;
}

input{
  flex:1;
  min-width:200px;
}

.card{
  background:var(--card);
  padding:20px;
  margin-bottom:15px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.2);
}

.card h2{
  margin-top:0;
  color:var(--accent);
}

.card p{
  line-height:1.6;
}

.btn{
  display:inline-block;
  padding:10px 15px;
  background:var(--accent);
  color:#000;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
  margin-top:10px;
}

#tombolMusik{
  position:fixed;
  right:20px;
  bottom:20px;
  padding:12px 18px;
  border:none;
  border-radius:30px;
  background:var(--accent);
  color:#000;
  font-weight:bold;
  cursor:pointer;
  z-index:1000;
}
</style>

</head>

<body>

<header>
  <h1>💻 PROGRAM</h1>
  <a href="index.html">← Kembali ke Beranda</a>
</header>

<div class="container">

  <div class="controls">
    <input type="text" id="search" placeholder="🔍 Cari program...">

```
<select id="category">
  <option value="all">Semua Kategori</option>
  <option value="Media Player">Media Player</option>
  <option value="Edit Foto">Edit Foto</option>
  <option value="Compress File">Compress File</option>
  <option value="Edit File PDF">Edit File PDF</option>
</select>
```

  </div>

  <div id="programList"></div>

</div>

<audio id="musik" loop>
  <source src="musik.mp3" type="audio/mpeg">
</audio>

<button id="tombolMusik" onclick="toggleMusik()">🎵 MUSIK ON</button>

<script>

const programs = [

  {
    name: "Winamp Pro 5.66",
    category: "Media Player",
    desc: "Pemutar musik klasik yang ringan dan mudah digunakan.",
    drive: "https://drive.google.com/file/d/1pIXCr736vsCqlCwzXDdwbL1WrmtWelev/view?usp=sharing"
  },

  {
    name: "VLC 1.1.7",
    category: "Media Player",
    desc: "Pemutar berbagai macam format video dan audio.",
    drive: "https://drive.google.com/file/d/1example/view?usp=sharing"
  },

  {
    name: "Photoshop CS3 Portable",
    category: "Edit Foto",
    desc: "Aplikasi editing foto portable yang ringan.",
    drive: "https://drive.google.com/file/d/1example/view?usp=sharing"
  },

  {
    name: "Winrar 3.9 Final",
    category: "Compress File",
    desc: "Aplikasi untuk membuka dan membuat file ZIP atau RAR.",
    drive: "https://drive.google.com/file/d/1example/view?usp=sharing"
  },

  {
    name: "PDF Editing",
    category: "Edit File PDF",
    desc: "Aplikasi yang dapat mengedit file-file PDF dengan mudah.",
    drive: "https://drive.google.com/file/d/1Mk-9SBJWwriNxxsUXFuSlfCA0jphpPby/view?usp=sharing"
  }

];

const search = document.getElementById("search");
const category = document.getElementById("category");
const programList = document.getElementById("programList");

function tampilkanProgram(){

  const keyword = search.value.toLowerCase();
  const selectedCategory = category.value;

  const hasil = programs.filter(program => {

    const cocokNama =
      program.name.toLowerCase().includes(keyword);

    const cocokDeskripsi =
      program.desc.toLowerCase().includes(keyword);

    const cocokKategori =
      selectedCategory === "all" ||
      program.category === selectedCategory;

    return (cocokNama || cocokDeskripsi) && cocokKategori;
  });

  programList.innerHTML = "";

  if(hasil.length === 0){
    programList.innerHTML = `
      <div class="card">
        <h2>😕 Program tidak ditemukan</h2>
        <p>Coba gunakan kata pencarian yang lain.</p>
      </div>
    `;
    return;
  }

  hasil.forEach(program => {

    programList.innerHTML += `
      <div class="card">
        <h2>${program.name}</h2>

        <p>
          <strong>Kategori:</strong>
          ${program.category}
        </p>

        <p>
          ${program.desc}
        </p>

        <a
          class="btn"
          href="${program.drive}"
          target="_blank"
          rel="noopener noreferrer">
          ⬇️ DOWNLOAD
        </a>
      </div>
    `;

  });

}

search.addEventListener("input", tampilkanProgram);
category.addEventListener("change", tampilkanProgram);

tampilkanProgram();


const musik = document.getElementById("musik");
const tombolMusik = document.getElementById("tombolMusik");

function toggleMusik(){

  if(musik.paused){

    musik.play()
      .then(() => {
        tombolMusik.textContent = "🎵 MUSIK ON";
      })
      .catch(() => {
        tombolMusik.textContent = "⚠️ MUSIK GAGAL";
      });

  }else{

    musik.pause();
    tombolMusik.textContent = "🔇 MUSIK OFF";

  }

}

</script>

</body>
</html>
