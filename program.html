<!DOCTYPE html>

<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dunia Landak - Program</title>

  <style>
    :root {
      --bg: url("gambar.jfif") center/cover fixed;
      --overlay: rgba(20, 19, 17, .88);
      --paper: #efe9dc;
      --panel: rgba(38, 36, 31, .88);
      --line: #454137;
      --gold: #c8992f;
      --muted: #9a9482;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(var(--overlay), var(--overlay)),
        var(--bg);
      background-color: #1c1b19;
      color: var(--paper);
      font-family: monospace;
    }

    header,
    main,
    footer {
      max-width: 1000px;
      margin: auto;
    }

    header {
      padding: 60px 24px 35px;
      border-bottom: 1px solid var(--line);
    }

    header a {
      color: var(--gold);
      text-decoration: none;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 3rem;
      margin: 15px 0 5px;
    }

    header p,
    .desc {
      color: var(--muted);
    }

    .tools {
      display: flex;
      gap: 10px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    input,
    select {
      padding: 14px 16px;
      background: rgba(20, 19, 17, .8);
      border: 1px solid var(--line);
      color: var(--paper);
      font-family: monospace;
      outline: none;
    }

    input {
      flex: 1;
      min-width: 220px;
    }

    input:focus,
    select:focus {
      border-color: var(--gold);
    }

    main {
      padding: 40px 24px 80px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px;
      margin-bottom: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
    }

    .info {
      flex: 1;
    }

    .label {
      color: var(--gold);
      font-size: .72rem;
      margin-top: 7px;
    }

    .title {
      font-size: 1rem;
      font-weight: bold;
    }

    .category {
      display: inline-block;
      margin-top: 5px;
      padding: 4px 8px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: .65rem;
    }

    .desc {
      margin-top: 4px;
      font-size: .8rem;
      line-height: 1.5;
    }

    .download {
      padding: 10px 17px;
      border: 1px solid var(--gold);
      color: var(--gold);
      text-decoration: none;
      font-size: .75rem;
      white-space: nowrap;
    }

    .download:hover {
      background: var(--gold);
      color: #1c1b19;
    }

    .empty {
      padding: 30px;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--muted);
    }

    footer {
      padding: 25px 24px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .7rem;
    }

    /* TOMBOL MUSIK */

    #tombolMusik {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 15px;
      background: #1c1b19;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: monospace;
      cursor: pointer;
      z-index: 9999;
    }

    #tombolMusik:hover {
      background: var(--gold);
      color: #1c1b19;
    }

    @media (max-width: 600px) {
      header {
        padding: 40px 18px 25px;
      }

      h1 {
        font-size: 2.3rem;
      }

      main {
        padding: 25px 18px 60px;
      }

      .card {
        align-items: flex-start;
        padding: 16px;
      }

      .download {
        padding: 9px 12px;
      }
    }
  </style>

</head>

<body>

<header>
  <a href="index.html">← Kembali ke Dunia Landak</a>

  <h1>Program</h1>

  <p>Kumpulan program dan source code.</p>

  <div class="tools">

    <input
      type="text"
      id="search"
      placeholder="Cari program..."
    >

    <select id="category">
      <option value="semua">Semua kategori</option>
    </select>

  </div>
</header>

<main>
  <div id="programList"></div>
</main>

<footer>
  Dunia Landak · Program
</footer>

<!-- MUSIK -->

<audio id="musik" loop>
  <source
    src="musik.mp3"
    type="audio/mpeg">
</audio>

<button id="tombolMusik" onclick="toggleMusik()">
  🎵 MUSIK OFF
</button>

<script>

const programs = [

  {
    name: "Winamp Pro 5.66",
    category: "Music Player",
    desc: "Aplikasi dengar Music keren",
    drive: "https://drive.google.com/file/d/1dF4CTQBNSeeU_NqjB2Rde7aodc_XcvbE/view?usp=sharing"
  },

  {
    name: "VLC 1.1.7",
    category: "Video Player",
    desc: "VLC 1.1.7 adalah versi lama dari pemutar media VLC yang dikenal karena stabilitas dan dukungan format multimedia yang luas tanpa codec tambahan.",
    drive: "https://drive.google.com/file/d/1eAawa0KrvTEXglMAMvaT31nsCO8b12XS/view?usp=sharing"
  },

  {
    name: "Photoshop CS 3 Portable",
    category: "Editing Photo",
    desc: "Adobe Photoshop CS3 Portable adalah versi “tanpa instalasi” dari Photoshop CS3 yang bisa langsung dijalankan dari folder atau flashdisk di Windows, cocok untuk komputer dengan spesifikasi rendah atau yang tidak memungkinkan instalasi software resmi.",
    drive: "https://drive.google.com/file/d/1T4MVD667X0caHekxt_Lxx0z0Cgjjjxee/view?usp=sharing"
  },

  {
    name: "Winrar 3.9 Final",
    category: "Compress File",
    desc: "WinRAR 3.9 adalah versi lama dari utilitas pengarsipan dan kompresi file populer untuk Windows yang dikembangkan oleh Eugene Roshal (win.rar GmbH/RARLAB). Versi ini merupakan bagian dari seri WinRAR 3.x yang dirilis pada era 2000-an dan masih menggunakan antarmuka klasik yang khas.",
    drive: "https://drive.google.com/file/d/1orvgznMZm4wwngzwq588KMWxUfzTsfxK/view?usp=sharing"
  },

  {
    name: "PDF Editing",
    category: "Edit File PDF",
    desc: "Aplikasi yang dapat mengedit file-file pdf dengan mudah.",
    drive: "https://drive.google.com/file/d/1Mk-9SBJWwriNxxsUXFuSlfCA0jphpPby/view?usp=sharing"
  },

  {
    name: "Tune Up Utilities 2012 + Crack",
    category: "Utility",
    desc: "TuneUp Utilities 2012 adalah aplikasi utilitas Windows untuk membantu melakukan perawatan, optimasi, dan pengaturan sistem.",
    drive: "https://drive.google.com/file/d/1veRlfyjCcnnvAPkipCuG1Dry5NIncK8C/view?usp=sharing"
  },

  {
    name: "MYOB",
    category: "Accounting",
    desc: "MYOB adalah aplikasi yang digunakan untuk membantu pengelolaan dan pencatatan keuangan serta akuntansi.",
    drive: "https://drive.google.com/file/d/1gZWgRAhzGTvaqQBbXm-ldlO-eiVMLCjP/view?usp=sharing"
  },

  {
    name: "Video Converter Ultimate 6.3",
    category: "Video Converter",
    desc: "Aplikasi untuk membantu mengubah atau mengonversi format file video ke berbagai format lainnya.",
    drive: "https://drive.google.com/file/d/1US9oJuvFPh07Fh_QoKUbsEy9gWPj4qeK/view?usp=sharing"
  }

];


const search = document.getElementById("search");
const category = document.getElementById("category");
const list = document.getElementById("programList");


const categories = [
  ...new Set(programs.map(program => program.category))
];


categories.forEach(cat => {
  category.innerHTML += `<option value="${cat}">${cat}</option>`;
});


function tampilkanProgram() {

  const kata = search.value.toLowerCase();
  const pilihKategori = category.value;

  const hasil = programs.filter(program => {

    const cocokSearch =
      program.name.toLowerCase().includes(kata) ||
      program.category.toLowerCase().includes(kata) ||
      program.desc.toLowerCase().includes(kata);

    const cocokKategori =
      pilihKategori === "semua" ||
      program.category === pilihKategori;

    return cocokSearch && cocokKategori;
  });


  if (hasil.length === 0) {
    list.innerHTML = `
      <div class="empty">
        Program tidak ditemukan.
      </div>
    `;
    return;
  }


  list.innerHTML = hasil.map(program => {

    const download = program.drive
      ? `<a class="download"
           href="${program.drive}"
           target="_blank"
           rel="noopener noreferrer">
           DOWNLOAD
         </a>`
      : "";

    return `
      <div class="card">

        <div class="info">

          <div class="label">Program</div>
          <div class="title">${program.name}</div>

          <div class="label">Kategori</div>
          <div class="category">${program.category}</div>

          <div class="label">Deskripsi</div>
          <div class="desc">${program.desc}</div>

        </div>

        ${download}

      </div>
    `;

  }).join("");
}


search.addEventListener("input", tampilkanProgram);
category.addEventListener("change", tampilkanProgram);

tampilkanProgram();


// ==============================
// PEMUTAR MUSIK
// ==============================

const musik = document.getElementById("musik");
const tombolMusik = document.getElementById("tombolMusik");


function toggleMusik() {

  if (musik.paused) {

    musik.play();

    tombolMusik.textContent = "🎵 MUSIK ON";

  } else {

    musik.pause();

    tombolMusik.textContent = "🔇 MUSIK OFF";

  }

}

</script>

</body>
</html>
