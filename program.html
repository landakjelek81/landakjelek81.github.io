<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>Dunia Landak - Program</title>

  <style>
    :root {
      --bg: url("gambar.jfif") center/cover fixed;
      --overlay: rgba(20, 19, 17, .88);
      --paper: #efe9dc;
      --panel: rgba(38, 36, 31, .88);
      --line: #454137;
      --gold: #c8992f;
      --muted: #9a9482;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(var(--overlay), var(--overlay)),
        var(--bg);
      background-color: #1c1b19;
      color: var(--paper);
      font-family: monospace;
    }

    header,
    main,
    footer {
      max-width: 1000px;
      margin: auto;
    }

    header {
      padding: 60px 24px 35px;
      border-bottom: 1px solid var(--line);
    }

    header a {
      color: var(--gold);
      text-decoration: none;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 3rem;
      margin: 15px 0 5px;
    }

    header p,
    .desc {
      color: var(--muted);
    }

    .tools {
      display: flex;
      gap: 10px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    input,
    select {
      padding: 14px 16px;
      background: rgba(20, 19, 17, .8);
      border: 1px solid var(--line);
      color: var(--paper);
      font-family: monospace;
      outline: none;
    }

    input {
      flex: 1;
      min-width: 220px;
    }

    input:focus,
    select:focus {
      border-color: var(--gold);
    }

    main {
      padding: 40px 24px 80px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px;
      margin-bottom: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .label {
      color: var(--gold);
      font-size: .72rem;
      margin-top: 7px;
    }

    .title {
      font-size: 1rem;
      font-weight: bold;
    }

    .category {
      display: inline-block;
      margin-top: 5px;
      padding: 4px 8px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: .65rem;
    }

    .desc {
      margin-top: 4px;
      font-size: .8rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .download {
      padding: 10px 17px;
      border: 1px solid var(--gold);
      color: var(--gold);
      text-decoration: none;
      font-size: .75rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .download:hover {
      background: var(--gold);
      color: #1c1b19;
    }

    .empty {
      padding: 30px;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--muted);
    }

    footer {
      padding: 25px 24px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .7rem;
    }

    /* TOMBOL MUSIK */

    #tombolMusik {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 15px;
      background: #1c1b19;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: monospace;
      cursor: pointer;
      z-index: 9999;
    }

    #tombolMusik:hover {
      background: var(--gold);
      color: #1c1b19;
    }

    @media (max-width: 600px) {
      header {
        padding: 40px 18px 25px;
      }

      h1 {
        font-size: 2.3rem;
      }

      main {
        padding: 25px 18px 60px;
      }

      .card {
        align-items: flex-start;
        padding: 16px;
      }

      .download {
        padding: 9px 12px;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html">← Kembali ke Dunia Landak</a>

  <h1>Program</h1>

  <p>Kumpulan program dan source code.</p>

  <div class="tools">

    <input
      type="text"
      id="search"
      placeholder="Cari program..."
      maxlength="100"
      autocomplete="off"
      spellcheck="false"
      aria-label="Cari program"
    >

    <select id="category" aria-label="Pilih kategori">
      <option value="semua">Semua kategori</option>
    </select>

  </div>
</header>

<main>
  <div id="programList"></div>
</main>

<footer>
  Dunia Landak · Program
</footer>

<!-- MUSIK -->

<audio id="musik" loop preload="none">
  <source
    src="musik.mp3"
    type="audio/mpeg">
</audio>

<button
  id="tombolMusik"
  type="button"
  aria-label="Putar musik">
  🎵 MUSIK OFF
</button>

<script>
"use strict";

/*
 * DATA PROGRAM
 * Semua data di bawah ini adalah data statis milik website.
 */
const programs = [
  {
    name: "Winamp Pro 5.66",
    category: "Music Player",
    desc: "Aplikasi dengar Music keren",
    drive: "https://drive.google.com/file/d/1dF4CTQBNSeeU_NqjB2Rde7aodc_XcvbE/view?usp=sharing"
  },

  {
    name: "VLC 1.1.7",
    category: "Video Player",
    desc: "VLC 1.1.7 adalah versi lama dari pemutar media VLC yang dikenal karena stabilitas dan dukungan format multimedia yang luas tanpa codec tambahan.",
    drive: "https://drive.google.com/file/d/1eAawa0KrvTEXglMAMvaT31nsCO8b12XS/view?usp=sharing"
  },

  {
    name: "Photoshop CS 3 Portable",
    category: "Editing Photo",
    desc: "Adobe Photoshop CS3 Portable adalah versi “tanpa instalasi” dari Photoshop CS3 yang bisa langsung dijalankan dari folder atau flashdisk di Windows, cocok untuk komputer dengan spesifikasi rendah atau yang tidak memungkinkan instalasi software resmi.",
    drive: "https://drive.google.com/file/d/1T4MVD667X0caHekxt_Lxx0z0Cgjjjxee/view?usp=sharing"
  },

  {
    name: "Winrar 3.9 Final",
    category: "Compress File",
    desc: "WinRAR 3.9 adalah versi lama dari utilitas pengarsipan dan kompresi file populer untuk Windows yang dikembangkan oleh Eugene Roshal (win.rar GmbH/RARLAB). Versi ini merupakan bagian dari seri WinRAR 3.x yang dirilis pada era 2000-an dan masih menggunakan antarmuka klasik yang khas.",
    drive: "https://drive.google.com/file/d/1orvgznMZm4wwngzwq588KMWxUfzTsfxK/view?usp=sharing"
  },

  {
    name: "PDF Editing",
    category: "Edit File PDF",
    desc: "Aplikasi yang dapat mengedit file-file pdf dengan mudah.",
    drive: "https://drive.google.com/file/d/1Mk-9SBJWwriNxxsUXFuSlfCA0jphpPby/view?usp=sharing"
  },

  {
    name: "Tune Up Utilities 2012 + Crack",
    category: "Utility",
    desc: "TuneUp Utilities 2012 adalah aplikasi utilitas Windows untuk membantu melakukan perawatan, optimasi, dan pengaturan sistem.",
    drive: "https://drive.google.com/file/d/1veRlfyjCcnnvAPkipCuG1Dry5NIncK8C/view?usp=sharing"
  },

  {
    name: "MYOB",
    category: "Accounting",
    desc: "MYOB adalah aplikasi yang digunakan untuk membantu pengelolaan dan pencatatan keuangan serta akuntansi.",
    drive: "https://drive.google.com/file/d/1gZWgRAhzGTvaqQBbXm-ldlO-eiVMLCjP/view?usp=sharing"
  },

  {
    name: "Video Converter Ultimate 6.3",
    category: "Video Converter",
    desc: "Aplikasi untuk membantu mengubah atau mengonversi format file video ke berbagai format lainnya.",
    drive: "https://drive.google.com/file/d/1US9oJuvFPh07Fh_QoKUbsEy9gWPj4qeK/view?usp=sharing"
  }
];


/* ELEMENT UTAMA */

const search = document.getElementById("search");
const category = document.getElementById("category");
const list = document.getElementById("programList");

const musik = document.getElementById("musik");
const tombolMusik = document.getElementById("tombolMusik");


/*
 * CEK LINK DOWNLOAD
 * Hanya izinkan URL HTTPS dari Google Drive.
 */
function linkGoogleDriveValid(urlString) {
  try {
    const url = new URL(urlString);

    return (
      url.protocol === "https:" &&
      (
        url.hostname === "drive.google.com" ||
        url.hostname === "www.drive.google.com"
      )
    );
  } catch {
    return false;
  }
}


/*
 * ISI KATEGORI
 * Menggunakan createElement + textContent,
 * bukan innerHTML.
 */

const categories = [
  ...new Set(
    programs
      .map(program => program.category)
      .filter(categoryName => typeof categoryName === "string")
  )
];

categories.forEach(cat => {
  const option = document.createElement("option");

  option.value = cat;
  option.textContent = cat;

  category.appendChild(option);
});


/*
 * BUAT ELEMEN TEKS
 */

function buatTeks(className, text) {
  const element = document.createElement("div");

  element.className = className;
  element.textContent = text;

  return element;
}


/*
 * TAMPILKAN PROGRAM
 */

function tampilkanProgram() {

  const kata = search.value
    .trim()
    .toLocaleLowerCase("id-ID");

  const pilihKategori = category.value;

  const hasil = programs.filter(program => {

    const name = String(program.name || "");
    const programCategory = String(program.category || "");
    const desc = String(program.desc || "");

    const cocokSearch =
      name.toLocaleLowerCase("id-ID").includes(kata) ||
      programCategory.toLocaleLowerCase("id-ID").includes(kata) ||
      desc.toLocaleLowerCase("id-ID").includes(kata);

    const cocokKategori =
      pilihKategori === "semua" ||
      programCategory === pilihKategori;

    return cocokSearch && cocokKategori;
  });


  /*
   * Bersihkan daftar menggunakan DOM,
   * bukan innerHTML.
   */
  list.replaceChildren();


  if (hasil.length === 0) {

    const empty = document.createElement("div");

    empty.className = "empty";
    empty.textContent = "Program tidak ditemukan.";

    list.appendChild(empty);

    return;
  }


  const fragment = document.createDocumentFragment();


  hasil.forEach(program => {

    const card = document.createElement("div");
    card.className = "card";


    const info = document.createElement("div");
    info.className = "info";


    const labelProgram = buatTeks(
      "label",
      "Program"
    );

    const title = buatTeks(
      "title",
      String(program.name || "")
    );

    const labelKategori = buatTeks(
      "label",
      "Kategori"
    );

    const categoryBadge = buatTeks(
      "category",
      String(program.category || "")
    );

    const labelDeskripsi = buatTeks(
      "label",
      "Deskripsi"
    );

    const desc = buatTeks(
      "desc",
      String(program.desc || "")
    );


    info.appendChild(labelProgram);
    info.appendChild(title);

    info.appendChild(labelKategori);
    info.appendChild(categoryBadge);

    info.appendChild(labelDeskripsi);
    info.appendChild(desc);


    card.appendChild(info);


    /*
     * Hanya buat tombol jika link benar-benar
     * menggunakan HTTPS dan Google Drive.
     */
    if (linkGoogleDriveValid(program.drive)) {

      const download = document.createElement("a");

      download.className = "download";
      download.href = program.drive;
      download.target = "_blank";
      download.rel = "noopener noreferrer";
      download.textContent = "DOWNLOAD";

      card.appendChild(download);
    }


    fragment.appendChild(card);

  });


  list.appendChild(fragment);
}


/*
 * EVENT PENCARIAN & KATEGORI
 */

search.addEventListener(
  "input",
  tampilkanProgram
);

category.addEventListener(
  "change",
  tampilkanProgram
);


/*
 * PEMUTAR MUSIK
 */

function toggleMusik() {

  if (musik.paused) {

    const playPromise = musik.play();

    if (playPromise !== undefined) {

      playPromise
        .then(() => {

          tombolMusik.textContent = "🎵 MUSIK ON";
          tombolMusik.setAttribute(
            "aria-label",
            "Jeda musik"
          );

        })
        .catch(() => {

          tombolMusik.textContent = "🎵 MUSIK OFF";
          tombolMusik.setAttribute(
            "aria-label",
            "Putar musik"
          );

        });

    }

  } else {

    musik.pause();

    tombolMusik.textContent = "🔇 MUSIK OFF";

    tombolMusik.setAttribute(
      "aria-label",
      "Putar musik"
    );

  }
}


tombolMusik.addEventListener(
  "click",
  toggleMusik
);


/*
 * TAMPILKAN DATA PERTAMA KALI
 */

tampilkanProgram();
</script>

</body>
</html>
