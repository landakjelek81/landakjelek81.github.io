<!DOCTYPE html>

<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dunia Landak</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --background: url("gambar.jfif") center/cover fixed;
      --overlay: rgba(20, 19, 17, 0.88);

      --paper: #efe9dc;
      --panel: rgba(38, 36, 31, 0.88);
      --line: #454137;
      --gold: #c8992f;
      --muted: #9a9482;
      --hover: rgba(200, 153, 47, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        linear-gradient(var(--overlay), var(--overlay)),
        var(--background);

      background-color: #1c1b19;
      background-attachment: fixed;

      color: var(--paper);
      font-family: 'IBM Plex Mono', monospace;
      line-height: 1.5;
    }

    header {
      max-width: 1000px;
      margin: 0 auto;
      padding: 80px 24px 45px;
      border-bottom: 1px solid var(--line);
    }

    header h1 {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: clamp(2.8rem, 7vw, 5rem);
      margin: 0 0 14px;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--muted);
      max-width: 650px;
      margin: 0;
      font-size: 0.9rem;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 55px 24px 100px;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .menu a {
      display: block;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 30px 25px;
      color: var(--paper);
      text-decoration: none;
      transition: 0.2s ease;
    }

    .menu a:hover {
      border-color: var(--gold);
      background: rgba(45, 42, 36, 0.94);
      transform: translateY(-3px);
    }

    .menu .number {
      display: block;
      color: var(--gold);
      font-size: 0.7rem;
      margin-bottom: 12px;
    }

    .menu .title {
      display: block;
      font-family: 'Fraunces', serif;
      font-size: 1.7rem;
      margin-bottom: 8px;
    }

    .menu .desc {
      color: var(--muted);
      font-size: 0.75rem;
    }

    footer {
      max-width: 1000px;
      margin: 0 auto;
      padding: 25px 24px 40px;
      color: var(--muted);
      font-size: 0.7rem;
      border-top: 1px solid var(--line);
    }

    /* TOMBOL MUSIK */

    #tombolMusik {
      position: fixed;
      right: 20px;
      bottom: 20px;

      background: var(--panel);
      color: var(--paper);

      border: 1px solid var(--gold);
      padding: 10px 15px;

      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;

      cursor: pointer;
      z-index: 9999;

      transition: 0.2s ease;
    }

    #tombolMusik:hover {
      background: var(--gold);
      color: #1c1b19;
    }

    @media (max-width: 600px) {

      header {
        padding: 55px 18px 35px;
      }

      main {
        padding: 40px 18px 70px;
      }

      .menu {
        grid-template-columns: 1fr;
      }

      .menu a {
        padding: 25px 20px;
      }

      #tombolMusik {
        right: 15px;
        bottom: 15px;
      }
    }
  </style>

</head>

<body>

  <!-- MUSIK -->

  <audio id="musik" loop>
    <source src="musik.mp3" type="audio/mpeg">
  </audio>

  <button id="tombolMusik" onclick="toggleMusik()">
    🎵 MUSIK OFF
  </button>

  <!-- HEADER -->

  <header>

```
<h1>Dunia Landak</h1>

<p>
  Kumpulan aplikasi, program, lagu, dan gambar
  yang saya buat dan bagikan secara bebas.
</p>
```

  </header>

  <!-- MENU -->

  <main>

```
<div class="menu">

  <a href="games.html">
    <span class="number">01</span>
    <span class="title">Games</span>
    <span class="desc">
      Kumpulan games dan permainan.
    </span>
  </a>

  <a href="program.html">
    <span class="number">02</span>
    <span class="title">Program</span>
    <span class="desc">
      Program dan source code.
    </span>
  </a>

  <a href="lagu.html">
    <span class="number">03</span>
    <span class="title">Lagu</span>
    <span class="desc">
      Koleksi lagu dan audio.
    </span>
  </a>

  <a href="gambar.html">
    <span class="number">04</span>
    <span class="title">Gambar</span>
    <span class="desc">
      Koleksi gambar dan karya.
    </span>
  </a>

</div>
```

  </main>

  <!-- FOOTER -->

  <footer>
    Dibuat &amp; dihosting oleh mrland.
  </footer>

  <!-- SCRIPT MUSIK -->

  <script>

    const musik = document.getElementById("musik");
    const tombolMusik = document.getElementById("tombolMusik");

    function toggleMusik() {

      if (musik.paused) {

        musik.play()
          .then(() => {
            tombolMusik.textContent = "🎵 MUSIK ON";
          })
          .catch((error) => {
            console.log(error);
            tombolMusik.textContent = "⚠️ MUSIK GAGAL";
          });

      } else {

        musik.pause();
        tombolMusik.textContent = "🔇 MUSIK OFF";

      }

    }

  </script>

</body>

</html>
