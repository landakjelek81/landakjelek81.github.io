<head>

  <title>Dunia Landak</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --background: url("images.jfif") center/cover fixed;
      --overlay: rgba(20, 19, 17, 0.88);

      --ink: #f1ecdf;
      --paper: #efe9dc;
      --panel: rgba(38, 36, 31, 0.88);
      --line: #454137;
      --gold: #c8992f;
      --muted: #9a9482;
      --hover: rgba(200, 153, 47, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        linear-gradient(var(--overlay), var(--overlay)),
        var(--background);

      background-color: #1c1b19;
      background-attachment: fixed;

      color: var(--paper);
      font-family: 'IBM Plex Mono', monospace;
      line-height: 1.5;
    }

    /* =========================
       HEADER
       ========================= */

    header {
      max-width: 1000px;
      margin: 0 auto;
      padding: 70px 24px 45px;
      border-bottom: 1px solid var(--line);
    }

    header h1 {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      margin: 0 0 14px;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--muted);
      max-width: 650px;
      margin: 0;
      font-size: 0.9rem;
    }

    /* =========================
       NAVIGATION
       ========================= */

    nav {
      max-width: 1000px;
      margin: 0 auto;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);

      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--line);
      padding: 8px 13px;
      font-size: 0.78rem;
      transition: 0.2s ease;
    }

    nav a:hover {
      color: var(--paper);
      border-color: var(--gold);
      background: var(--hover);
    }

    /* =========================
       MAIN
       ========================= */

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 45px 24px 100px;
    }

    section {
      margin-bottom: 70px;
      scroll-margin-top: 20px;
    }

    section h2 {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 1.7rem;

      display: flex;
      align-items: baseline;
      gap: 14px;

      margin: 0 0 22px;
    }

    section h2 .count {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 400;
    }

    /* =========================
       CARD
       ========================= */

    .list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);

      padding: 18px 20px;

      display: grid;
      grid-template-columns: 1fr auto;
      gap: 15px 25px;
      align-items: center;

      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        transform 0.2s ease;
    }

    .card:hover {
      border-color: #665f4d;
      background: rgba(45, 42, 36, 0.94);
      transform: translateX(3px);
    }

    .card-info {
      min-width: 0;
    }

    .card .title {
      display: inline-block;

      color: var(--paper);
      font-size: 0.98rem;
      font-weight: 500;

      margin: 0 0 5px;

      text-decoration: none;
    }

    .card .title:hover {
      color: var(--gold);
    }

    .card .desc {
      color: var(--muted);
      font-size: 0.78rem;
      margin: 0;
    }

    .card .meta {
      color: var(--gold);
      font-size: 0.68rem;
      margin: 7px 0 0;
    }

    .card .button {
      display: inline-block;

      color: #211e18;
      background: var(--gold);

      text-decoration: none;

      padding: 9px 14px;

      font-size: 0.72rem;
      white-space: nowrap;

      border-radius: 1px;

      transition: 0.2s ease;
    }

    .card .button:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }

    /* =========================
       FOOTER
       ========================= */

    footer {
      max-width: 1000px;
      margin: 0 auto;
      padding: 25px 24px 40px;

      color: var(--muted);
      font-size: 0.7rem;

      border-top: 1px solid var(--line);
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      header {
        padding: 50px 18px 35px;
      }

      nav {
        padding: 14px 18px;
      }

      main {
        padding: 35px 18px 70px;
      }

      .card {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .card .button {
        justify-self: start;
      }

      section {
        margin-bottom: 55px;
      }
    }
  </style>

    /* =========================================================
       MESIN PEMBUAT LIST
       
       BAGIAN INI JANGAN DIUBAH.
       ========================================================= */

    function tampilkanList(data, id) {

      const container = document.getElementById(id);

      data.forEach(function(item) {

        const card = document.createElement("article");
        card.className = "card";

        card.innerHTML = `
          <div class="card-info">

            <a
              class="title"
              href="${item.link}"
              target="_blank"
              rel="noopener noreferrer">
              ${item.title}
            </a>

            <p class="desc">
              ${item.desc}
            </p>

            <p class="meta">
              ${item.meta}
            </p>

          </div>

          <a
            class="button"
            href="${item.link}"
            target="_blank"
            rel="noopener noreferrer">
            Buka
          </a>
        `;

        container.appendChild(card);

      });

    }


    tampilkanList(aplikasi, "aplikasi-list");
    tampilkanList(program, "program-list");
    tampilkanList(lagu, "lagu-list");
    tampilkanList(gambar, "gambar-list");

  </script>
