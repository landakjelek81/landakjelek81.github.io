<!DOCTYPE html>

<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dunia Landak - Lagu</title>

<style>

:root {
  --background:url("gambar.jfif") center/cover fixed;
  --overlay:rgba(20,19,17,.88);
  --paper:#efe9dc;
  --panel:rgba(38,36,31,.88);
  --line:#454137;
  --gold:#c8992f;
  --muted:#9a9482;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  min-height:100vh;

  background:
    linear-gradient(var(--overlay),var(--overlay)),
    var(--background);

  background-color:#1c1b19;
  background-attachment:fixed;

  color:var(--paper);
  font-family:monospace;
}

header,main,footer {
  max-width:1000px;
  margin:auto;
}

header {
  padding:60px 24px 35px;
  border-bottom:1px solid var(--line);
}

header a {
  color:var(--gold);
  text-decoration:none;
}

h1 {
  font-family:Georgia,serif;
  font-size:3rem;
  margin:15px 0 5px;
}

header p {
  color:var(--muted);
}

main {
  padding:40px 24px 80px;
}

/* SEARCH */

.search-box {
  margin-bottom:30px;
}

.search-box input {
  width:100%;
  padding:16px 18px;

  background:rgba(20,19,17,.9);
  border:1px solid var(--line);

  color:var(--paper);
  font-family:monospace;
  font-size:1rem;

  outline:none;
}

.search-box input:focus {
  border-color:var(--gold);
}

.search-box input::placeholder {
  color:var(--muted);
}

.hasil {
  margin-top:8px;
  color:var(--muted);
  font-size:.75rem;
}

.lagu-list {
  display:flex;
  flex-direction:column;
  gap:8px;
}

.huruf {
  color:var(--gold);
  font-size:1rem;
  font-weight:bold;
  margin-top:20px;
  margin-bottom:4px;
}

.card {
  background:var(--panel);
  border:1px solid var(--line);
  padding:18px 20px;
  transition:.2s ease;
}

.card:hover {
  border-color:var(--gold);
  transform:translateX(3px);
}

.artis {
  display:inline;
  color:var(--paper);
  font-size:1rem;
  font-weight:500;
}

.artis::after {
  content:" — ";
  color:var(--muted);
}

.judul {
  display:inline;
  color:var(--muted);
  text-decoration:none;
  font-size:.8rem;
}

.judul:hover {
  color:var(--gold);
}

footer {
  border-top:1px solid var(--line);
  padding:25px 24px;
  color:var(--muted);
  font-size:.7rem;
}

@media (max-width:600px) {

  header {
    padding:45px 18px 30px;
  }

  main {
    padding:30px 18px 60px;
  }

  h1 {
    font-size:2.4rem;
  }

}

</style>

</head>
