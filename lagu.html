<!DOCTYPE html>

<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dunia Landak - Lagu</title>

<style>

:root {
  --background:url("gambar.jfif") center/cover fixed;
  --overlay:rgba(20,19,17,.88);
  --paper:#efe9dc;
  --panel:rgba(38,36,31,.88);
  --line:#454137;
  --gold:#c8992f;
  --muted:#9a9482;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  min-height:100vh;

  background:
    linear-gradient(var(--overlay),var(--overlay)),
    var(--background);

  background-color:#1c1b19;
  background-attachment:fixed;

  color:var(--paper);
  font-family:monospace;
}

header,main,footer {
  max-width:1000px;
  margin:auto;
}

header {
  padding:60px 24px 35px;
  border-bottom:1px solid var(--line);
}

header a {
  color:var(--gold);
  text-decoration:none;
}

h1 {
  font-family:Georgia,serif;
  font-size:3rem;
  margin:15px 0 5px;
}

header p {
  color:var(--muted);
}

main {
  padding:40px 24px 80px;
}

/* DAFTAR LAGU */

.lagu-list {
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:10px;
}

.card {
  background:var(--panel);
  border:1px solid var(--line);
  padding:20px;
  min-height:100px;
  transition:.2s ease;
}

.card:hover {
  border-color:var(--gold);
  transform:translateY(-3px);
}

.huruf {
  color:var(--gold);
  font-size:.7rem;
  margin-bottom:10px;
}

.judul {
  display:block;
  color:var(--paper);
  text-decoration:none;
  font-size:.9rem;
}

.judul:hover {
  color:var(--gold);
}

.penyanyi {
  color:var(--muted);
  font-size:.7rem;
  margin-top:5px;
}

footer {
  border-top:1px solid var(--line);
  padding:25px 24px;
  color:var(--muted);
  font-size:.7rem;
}

/* HP */

@media (max-width:700px) {

  .lagu-list {
    grid-template-columns:repeat(2, 1fr);
  }

}

@media (max-width:500px) {

  header {
    padding:45px 18px 30px;
  }

  main {
    padding:30px 18px 60px;
  }

  .lagu-list {
    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>

<header>

<a href="index.html">← Kembali ke Dunia Landak</a>

<h1>Lagu</h1>

<p>
Kumpulan lagu dan audio, disusun berdasarkan abjad.
</p>

</header>

<main>

<div class="lagu-list">

  <!-- W -->

  <article class="card">

```
<div class="huruf">W</div>

<a
  class="judul"
  href="https://drive.google.com/file/d/1zuN0Ko5g0Hr-8JQkmgO2t2J2w-iU4atw/view?usp=drive_link"
  target="_blank"
  rel="noopener noreferrer">
  Soledad
</a>

<div class="penyanyi">
  Westlife
</div>
```

  </article>

  <!-- Y -->

  <article class="card">

```
<div class="huruf">Y</div>

<a
  class="judul"
  href="https://drive.google.com/file/d/15FZSjHJlB-3KfcvLPJ7vIVVnqC06CQQi/view?usp=drive_link"
  target="_blank"
  rel="noopener noreferrer">
  Kucari Jalan Terbaik
</a>

<div class="penyanyi">
  Yuni Shara
</div>
```

  </article>

</div>

</main>

<footer>
Dunia Landak · Lagu
</footer>

</body>
</html>
