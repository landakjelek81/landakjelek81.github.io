<style>

/* =========================
   VARIABEL
   ========================= */

:root {
  --background:url("images.jfif") center/cover fixed;
  --overlay:rgba(20,19,17,.78);

  --paper:#efe9dc;
  --panel:rgba(38,36,31,.90);
  --line:#454137;

  --gold:#c8992f;
  --muted:#9a9482;
}


/* =========================
   RESET
   ========================= */

* {
  box-sizing:border-box;
}


/* =========================
   BODY
   ========================= */

body {
  margin:0;
  min-height:100vh;

  background:
    linear-gradient(var(--overlay),var(--overlay)),
    var(--background);

  background-color:#1c1b19;
  background-attachment:fixed;

  color:var(--paper);
  font-family:monospace;
}


/* =========================
   CONTAINER
   ========================= */

header,
main,
footer {
  max-width:1000px;
  margin:auto;
}


/* =========================
   HEADER
   ========================= */

header {
  padding:60px 24px 35px;
  border-bottom:1px solid var(--line);
}

header a {
  color:var(--gold);
  text-decoration:none;
  transition:opacity .2s ease;
}

header a:hover {
  opacity:.7;
}

h1 {
  font-family:Georgia,serif;
  font-size:3rem;
  margin:15px 0 5px;
}

header p {
  color:var(--muted);
  margin-top:10px;
}


/* =========================
   MAIN
   ========================= */

main {
  padding:40px 24px 80px;
}


/* =========================
   GALERI
   ========================= */

.gallery {
  display:grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap:18px;
}


/* =========================
   CARD
   ========================= */

.card {
  background:var(--panel);

  border:1px solid var(--line);

  padding:12px;

  margin:0;

  transition:
    transform .2s ease,
    border-color .2s ease,
    background .2s ease;
}

.card:hover {
  transform:translateY(-5px);

  border-color:var(--gold);

  background:rgba(45,42,36,.96);
}


/* =========================
   LINK
   ========================= */

.card a {
  display:block;

  color:var(--paper);

  text-decoration:none;
}


/* =========================
   GAMBAR
   ========================= */

.card img {
  display:block;

  width:100%;
  height:220px;

  object-fit:cover;

  background:#1c1b19;

  border:1px solid var(--line);

  transition:
    opacity .2s ease,
    transform .2s ease;
}

.card:hover img {
  opacity:.9;
  transform:scale(1.01);
}


/* =========================
   NAMA LOGO
   ========================= */

.filename {
  display:block;

  padding:13px 5px 5px;

  color:var(--paper);

  font-size:.82rem;

  line-height:1.5;

  word-break:break-word;
}

.number {
  display:block;

  color:var(--gold);

  font-size:.65rem;

  margin-bottom:4px;
}


/* =========================
   FOOTER
   ========================= */

footer {
  border-top:1px solid var(--line);

  padding:25px 24px;

  color:var(--muted);

  font-size:.7rem;
}


/* =========================
   TABLET
   ========================= */

@media (max-width:700px) {

  .gallery {
    grid-template-columns:repeat(2, minmax(0, 1fr));
  }

  .card img {
    height:180px;
  }

}


/* =========================
   HP
   ========================= */

@media (max-width:450px) {

  header {
    padding:45px 18px 30px;
  }

  h1 {
    font-size:2.5rem;
  }

  main {
    padding:30px 18px 60px;
  }

  .gallery {
    grid-template-columns:1fr;
  }

  .card img {
    height:auto;
    min-height:200px;
    max-height:400px;
  }

}

</style>
